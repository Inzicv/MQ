# Catalogue d'attributs MQ V5.3 (NonStop, série J) -> V8.1 (NonStop, série L)
#
# Seedé le 2026-09-15 à partir de deux captures runmqsc réelles sur le QM MT03 :
#   - ISIS  (V5.3, source)  : DISPLAY QMGR/QLOCAL/QALIAS/QREMOTE/QMODEL/CHANNEL/PROCESS/NAMELIST ALL
#   - LEIA  (V8.1, cible)   : mêmes commandes, QM déjà converti -> vérité terrain
#
# Pour chaque type d'objet :
#   name_attr   : l'attribut de sortie DISPLAY qui porte le nom de l'objet
#   define_cmd  : le mot-clé MQSC utilisé pour DEFINE/ALTER
#   runtime     : attributs présents en sortie DISPLAY mais interdits en DEFINE/ALTER
#                 (générés par le QM : dates, compteurs, TYPE implicite...)
#   renamed     : attributs V5.3 dont le nom a changé en V8.1 (mapping ancien -> nouveau)
#   removed     : attributs V5.3 qui n'existent plus du tout en V8.1
#   valid       : liste blanche des attributs DEFINE/ALTER valides en V8.1 pour ce type
#                 (issue de la capture LEIA réelle -- vérité terrain).
#                 Un attribut source absent de cette liste (et absent de runtime/renamed)
#                 n'est jamais supprimé silencieusement : il est conservé dans la sortie
#                 et signalé en warning dans le rapport ("attribut inconnu du catalogue").
#   flags       : attributs booléens MQSC sans parenthèses (paires de mots-clés opposés).
#                 Les deux mots-clés de la paire sont acceptés en entrée comme en sortie.
#   forced      : attributs toujours forcés à une valeur donnée en sortie, quelle que soit
#                 la valeur (ou l'absence) côté source.
#   review      : attributs V8.1 absents de V5.3, à décision explicite (non ajoutés
#                 automatiquement -- si omis, le DEFINE V8.1 prend sa valeur par défaut,
#                 qui correspond en général à ce qu'affiche LEIA). Documentés dans le
#                 rapport, jamais injectés silencieusement dans le MQSC généré.

